[project]
name = "trader-ai"
version = "0.1.0"
description = "Local-only personal investment ledger and deterministic analytics"
requires-python = ">=3.12"
dependencies = [
    "casparser==1.4.1",
    "certifi>=2026.7.22",
    "anthropic==1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
